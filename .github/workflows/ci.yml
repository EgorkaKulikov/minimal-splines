# CI of the minimal-splines library.
#
# DEPENDENCY ON numerical-core. The library is built against the published
# numerical-core artifact from GitHub Packages
# (https://maven.pkg.github.com/EgorkaKulikov/numerical-core; the version is numericalCoreVersion
# in gradle.properties, the repository is declared in repositories of build.gradle.kts). GitHub Packages
# requires authentication even for reading, so GITHUB_TOKEN is passed to the gradle steps
# (the built-in token reads packages of the same owner; this workflow needs the
# packages: read permission; GITHUB_ACTOR is set by the runner itself).
#
# Three jobs:
#   * test — tests on the matrix "operating system × BLAS/LAPACK implementation".
#     The implementation is selected by the `numerics.backend` property (java — the portable
#     netlib F2J implementation, native — the system BLAS/LAPACK through JNI). On Ubuntu the system
#     libraries are not preinstalled, so for the native variant libopenblas-dev is installed:
#     it provides libblas.so.3 and liblapack.so.3 through alternatives.
#     Without them netlib silently falls back to F2J; the fallback is detected by a separate
#     implementation check step. The coverage report and its threshold (koverVerify, part of check)
#     are taken on the ubuntu × java variant.
#   * publish-check — publication to the local Maven repository and a check of the contents
#     of the artifact and of its POM.
#   * publish — publication of the artifact to GitHub Packages. Runs only when
#     a tag of the form vX.Y.Z is pushed and after the two previous jobs succeed.
#
# The tests check mathematical invariants (biorthogonality, partition of unity,
# exactness on span) and machine-independent tolerances.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: read

env:
  # Credentials for reading numerical-core from GitHub Packages (see repositories in build.gradle.kts).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# A new run on the same branch cancels the previous unfinished one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [java, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      # On macOS the system BLAS/LAPACK is provided by Accelerate, nothing needs to be installed.
      - name: Install system BLAS/LAPACK (Ubuntu, native)
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'native'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev

      # The default implementation must be the system one, otherwise the native variant of the matrix
      # would check the same thing as java: BackendSelectionTest compares Backends.default()
      # with the requested property and fails if the fallback to F2J happened.
      - name: Check the system BLAS/LAPACK implementation
        if: matrix.backend == 'native'
        run: ./gradlew test --tests splines.BackendSelectionTest -Dnumerics.backend=native --no-daemon
        env:
          OPENBLAS_NUM_THREADS: 4

      - name: Tests on the ${{ matrix.backend }} implementation
        run: ./gradlew test -Dnumerics.backend=${{ matrix.backend }} --no-daemon
        env:
          # Thread limit for the system OpenBLAS: the multithreaded dgetrf on the default
          # thread stack terminated the test JVM with a signal (exit 139).
          OPENBLAS_NUM_THREADS: 4

      # The full check (check includes koverVerify) and the coverage report are taken once,
      # on the most reproducible variant of the matrix (Ubuntu, pure JVM implementation).
      - name: Check (check with the coverage bar) and Kover report
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'java'
        run: ./gradlew check koverXmlReport -Dnumerics.backend=java --no-daemon

      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            build/reports/tests/
            build/reports/kover/
            build/reports/boundary-cases.tsv
            build/test-results/
            **/hs_err_pid*.log
          if-no-files-found: ignore

  publish-check:
    name: Artifact publication check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      - name: Publish the artifact locally (check of the POM and of the sources)
        run: ./gradlew publishToMavenLocal --no-daemon

      # The coordinates and the version are read from gradle.properties, so that the check does not
      # diverge from the build when the version changes.
      - name: Check the contents of the artifact and of the POM
        run: |
          set -eu
          group=$(grep '^group=' gradle.properties | cut -d= -f2 | tr . /)
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          dir="$HOME/.m2/repository/$group/minimal-splines/$version"
          ls -la "$dir"
          for f in "minimal-splines-$version.jar" "minimal-splines-$version-sources.jar" "minimal-splines-$version.pom"; do
            test -s "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
          done
          pom="$dir/minimal-splines-$version.pom"
          # The dependency on numerical-core must be declared in the compile scope (api).
          grep -q '<artifactId>numerical-core</artifactId>' "$pom" || { echo "the POM does not declare the numerical-core dependency"; exit 1; }
          echo "artifact $group:minimal-splines:$version published correctly"

  publish:
    name: Publish to GitHub Packages
    # On a version tag only: pushing to a branch does not publish the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      # Credentials for GitHub Packages: the name of the actor and the built-in workflow token.
      - name: Publish the artifact to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
