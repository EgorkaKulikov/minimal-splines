# CI библиотеки minimal-splines.
#
# ЗАВИСИМОСТЬ ОТ numerical-core. Библиотека собирается против ОПУБЛИКОВАННОГО
# артефакта numerical-core из GitHub Packages
# (https://maven.pkg.github.com/EgorkaKulikov/numerical-core; версия — numericalCoreVersion
# в gradle.properties, репозиторий объявлен в repositories build.gradle.kts). GitHub Packages
# требует аутентификацию даже на чтение, поэтому шагам gradle передаётся GITHUB_TOKEN
# (встроенный токен читает пакеты того же владельца; для этого workflow нужно разрешение
# packages: read; GITHUB_ACTOR runner выставляет сам). Это НЕ зависимость от исходников:
# сборка видит numerical-core только как jar, что проверяет задача
# verifyArtifactDependencies (входит в check).
#
# Машинно-зависимых гейтов здесь нет: тесты проверяют математические инварианты
# (биортогональность, разбиение единицы, точность на span), а не эталонные снимки.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  # Учётные данные для чтения numerical-core из GitHub Packages (см. repositories в build.gradle.kts).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты, инварианты и покрытие
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      - name: Проверка (тесты, verifyArtifactDependencies, покрытие)
        run: ./gradlew check koverXmlReport --no-daemon

      - name: Тесты на чисто-Java бэкенде линейной алгебры (F2J LAPACK)
        run: ./gradlew test -Dnumerics.backend=java --no-daemon

      - name: Локальная публикация артефакта (проверка POM и sources)
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/kover/

  consumer-example:
    name: Контракт стороннего потребителя (examples/standalone-consumer)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # minimal-splines в удалённый реестр пока не публикуется — пример берёт его из mavenLocal.
      - name: Опубликовать minimal-splines в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      # Отдельная Gradle-сборка со своим settings.gradle.kts: подключает обе библиотеки
      # только как артефакты (numerical-core — из GitHub Packages) и не знает об
      # integral-equations. Падение здесь означает, что границы библиотек нарушены.
      - name: Собрать и запустить пример потребителя
        run: ./gradlew -p examples/standalone-consumer run --no-daemon
