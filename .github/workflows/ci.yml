# CI библиотеки minimal-splines.
#
# ЗАВИСИМОСТЬ ОТ numerical-core. Библиотека собирается против ОПУБЛИКОВАННОГО
# артефакта numerical-core, а удалённого реестра Maven у проекта пока нет. Поэтому job
# сначала клонирует репозиторий numerical-core (адрес — в env NUMERICAL_CORE_REPO,
# ветка — NUMERICAL_CORE_REF) и публикует его в ~/.m2 командой publishToMavenLocal, и
# только затем собирает эту библиотеку. Это НЕ зависимость от исходников: сборка здесь
# видит numerical-core только как jar в mavenLocal, что проверяет задача
# verifyArtifactDependencies (входит в check).
#
# При появлении реестра шаги «Клонировать numerical-core» и «Опубликовать numerical-core»
# удаляются, а в вызовы gradle добавляется -PnumericsRepositoryUrl=<адрес реестра>
# (см. repositories в build.gradle.kts). Версия артефакта — numericalCoreVersion в
# gradle.properties; при клонировании берётся ветка NUMERICAL_CORE_REF, поэтому её
# версия обязана совпадать с numericalCoreVersion — иначе резолюция зависимости упадёт.
#
# Машинно-зависимых гейтов здесь нет: тесты проверяют математические инварианты
# (биортогональность, разбиение единицы, точность на span), а не эталонные снимки.

name: CI

on:
  push:
  pull_request:

env:
  NUMERICAL_CORE_REPO: https://github.com/EgorkaKulikov/numerical-core
  NUMERICAL_CORE_REF: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты, инварианты и покрытие
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      - name: Клонировать numerical-core
        run: git clone --depth 1 --branch "$NUMERICAL_CORE_REF" "$NUMERICAL_CORE_REPO" ../numerical-core

      - name: Опубликовать numerical-core в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon
        working-directory: ../numerical-core

      - name: Проверка (тесты, verifyArtifactDependencies, покрытие)
        run: ./gradlew check koverXmlReport --no-daemon

      - name: Тесты на эталонном бэкенде линейной алгебры
        run: ./gradlew test -Dnumerics.backend=reference --no-daemon

      - name: Локальная публикация артефакта (проверка POM и sources)
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/kover/

  consumer-example:
    name: Контракт стороннего потребителя (examples/standalone-consumer)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      - name: Клонировать numerical-core
        run: git clone --depth 1 --branch "$NUMERICAL_CORE_REF" "$NUMERICAL_CORE_REPO" ../numerical-core

      - name: Опубликовать numerical-core в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon
        working-directory: ../numerical-core

      - name: Опубликовать minimal-splines в mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      # Отдельная Gradle-сборка со своим settings.gradle.kts: подключает обе библиотеки
      # только как артефакты и не знает об integral-equations. Падение здесь означает,
      # что границы библиотек нарушены.
      - name: Собрать и запустить пример потребителя
        run: ./gradlew -p examples/standalone-consumer run --no-daemon
